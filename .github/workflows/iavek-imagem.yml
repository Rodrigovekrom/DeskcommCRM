# Imagem do app com a identidade ia.vek (fork Rodrigovekrom/DeskcommCRM).
#
# Só o serviço `app` muda no fork: worker, scheduler e voice-agent seguem nas
# imagens publicadas pelo upstream, com a mesma versão. Por isso este
# workflow constrói UMA imagem, linux/amd64 (a VPS HostGator é x86_64).
#
# Tags publicadas:
#   ghcr.io/<dono>/iavek-crm:<branch>-<sha7>   imutável — é a que vai no APP_IMAGE
#   ghcr.io/<dono>/iavek-crm:<branch>          móvel — conveniência para staging
#
# O gate antes do push é o que a mudança visual alcança: typecheck e a suíte
# unitária inteira (em Linux, onde os testes do kit de shell também rodam).
name: iavek-imagem

on:
  push:
    branches: ["iavek/**"]
  workflow_dispatch: {}

concurrency:
  group: iavek-imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 10
      - name: typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: test:unit
        run: pnpm test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  imagem:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Nome e tags
        id: tags
        run: |
          dono="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ramo="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          img="${REGISTRY}/${dono}/iavek-crm"
          echo "img=${img}" >> "$GITHUB_OUTPUT"
          echo "tags=${img}:${ramo}-${GITHUB_SHA::7},${img}:${ramo}" >> "$GITHUB_OUTPUT"
          echo "versao=${ramo}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ia.vek CRM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.versao }}
          cache-from: type=gha,scope=iavek-app
          cache-to: type=gha,mode=max,scope=iavek-app

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "APP_IMAGE=${{ steps.tags.outputs.img }}:${{ steps.tags.outputs.versao }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
