# Imagem do app com a identidade ia.vek (fork Rodrigovekrom/DeskcommCRM).
#
# Constrói DUAS imagens, linux/amd64 (a VPS HostGator é x86_64):
#   - o `app` (Next) com a identidade ia.vek;
#   - o `worker` (agent-engine). Até a v1 só o app mudava no fork e o worker
#     seguia no do upstream; desde a regra de preço em três níveis (D1) o turno
#     do agente — que roda no WORKER — tem código nosso. Sem esta imagem a
#     mudança aparece no teste da tela (que roda no app) e NÃO no WhatsApp.
# Scheduler e voice-agent seguem nas imagens do upstream, com a mesma versão.
#
# Tags publicadas (mesma tag para as duas — app e worker andam juntos):
#   ghcr.io/<dono>/iavek-crm:<branch>-<sha7>         imutável — vai no APP_IMAGE
#   ghcr.io/<dono>/iavek-crm-worker:<branch>-<sha7>  imutável — vai no WORKER_IMAGE
#   ...:<branch>                                     móvel — conveniência para staging
#
# O gate antes do push é o que a mudança visual alcança: typecheck e a suíte
# unitária inteira (em Linux, onde os testes do kit de shell também rodam).
name: iavek-imagem

on:
  push:
    branches: ["iavek/**"]
  workflow_dispatch: {}

concurrency:
  group: iavek-imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 10
      - name: typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: test:unit
        run: pnpm test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  imagem:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Nome e tags
        id: tags
        run: |
          dono="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ramo="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          img="${REGISTRY}/${dono}/iavek-crm"
          wrk="${REGISTRY}/${dono}/iavek-crm-worker"
          echo "img=${img}" >> "$GITHUB_OUTPUT"
          echo "wrk=${wrk}" >> "$GITHUB_OUTPUT"
          echo "tags=${img}:${ramo}-${GITHUB_SHA::7},${img}:${ramo}" >> "$GITHUB_OUTPUT"
          echo "tags_worker=${wrk}:${ramo}-${GITHUB_SHA::7},${wrk}:${ramo}" >> "$GITHUB_OUTPUT"
          # ia.vek: o scheduler também é nosso — os crons do fork (estoque, esteira,
          # relatório, tarefas vencidas) moram em docker/scheduler/entrypoint.sh.
          sch="${REGISTRY}/${dono}/iavek-crm-scheduler"
          echo "tags_scheduler=${sch}:${ramo}-${GITHUB_SHA::7},${sch}:${ramo}" >> "$GITHUB_OUTPUT"
          echo "versao=${ramo}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ia.vek CRM
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.versao }}
          cache-from: type=gha,scope=iavek-app
          cache-to: type=gha,mode=max,scope=iavek-app

      - name: Build e push do worker (agent-engine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags_worker }}
          labels: |
            org.opencontainers.image.title=ia.vek CRM worker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.versao }}
          cache-from: type=gha,scope=iavek-worker
          cache-to: type=gha,mode=max,scope=iavek-worker

      - name: Build e push do scheduler (crons)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scheduler
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags_scheduler }}
          labels: |
            org.opencontainers.image.title=ia.vek CRM scheduler
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas"
            echo
            echo '```'
            echo "APP_IMAGE=${{ steps.tags.outputs.img }}:${{ steps.tags.outputs.versao }}"
            echo "WORKER_IMAGE=${{ steps.tags.outputs.wrk }}:${{ steps.tags.outputs.versao }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
